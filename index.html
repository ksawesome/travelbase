<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TravelBase — Your secure travel planning companion">
  <meta name="theme-color" content="#0a0e27">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TravelBase</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <!-- ZERO-LOAD: Only login UI exists before authentication -->
  <div id="login-root">
    <div class="login-bg">
      <div class="login-blob login-blob--1"></div>
      <div class="login-blob login-blob--2"></div>
      <div class="login-blob login-blob--3"></div>
    </div>

    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <defs>
                <linearGradient id="logoGrad" x1="0" y1="0" x2="48" y2="48">
                  <stop offset="0%" stop-color="#00d4ff"/>
                  <stop offset="100%" stop-color="#7c3aed"/>
                </linearGradient>
              </defs>
              <circle cx="24" cy="24" r="22" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
              <path d="M14 28 L22 18 L26 24 L34 14" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M30 14 L34 14 L34 18" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <circle cx="14" cy="28" r="2" fill="#00d4ff"/>
              <circle cx="34" cy="14" r="2" fill="#7c3aed"/>
            </svg>
          </div>
          <h1 class="login-title">TravelBase</h1>
          <p class="login-subtitle" id="login-subtitle">Sign in to your account</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="login-form" autocomplete="off">
          <div class="form-group">
            <input type="text" id="login-username" class="form-input" placeholder=" " required autocomplete="username">
            <label for="login-username" class="form-label">Username</label>
            <div class="form-focus-line"></div>
          </div>
          <div class="form-group">
            <input type="password" id="login-password" class="form-input" placeholder=" " required autocomplete="current-password">
            <label for="login-password" class="form-label">Password</label>
            <div class="form-focus-line"></div>
            <button type="button" id="toggle-password" class="password-toggle" aria-label="Toggle password visibility">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="login-remember">
              <span class="checkmark"></span>
              <span>Remember me</span>
            </label>
          </div>
          <div id="login-error" class="login-error" role="alert"></div>
          <button type="submit" id="login-btn" class="btn-login">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader"></span>
          </button>
        </form>

        <!-- Setup Form (first visit) -->
        <form id="setup-form" class="login-form" style="display:none" autocomplete="off">
          <div class="form-group">
            <input type="text" id="setup-username" class="form-input" placeholder=" " required minlength="3" autocomplete="off">
            <label for="setup-username" class="form-label">Choose a username</label>
            <div class="form-focus-line"></div>
          </div>
          <div class="form-group">
            <input type="password" id="setup-password" class="form-input" placeholder=" " required minlength="6" autocomplete="new-password">
            <label for="setup-password" class="form-label">Create a password</label>
            <div class="form-focus-line"></div>
          </div>
          <div class="form-group">
            <input type="password" id="setup-confirm" class="form-input" placeholder=" " required autocomplete="new-password">
            <label for="setup-confirm" class="form-label">Confirm password</label>
            <div class="form-focus-line"></div>
          </div>
          <div id="setup-error" class="login-error" role="alert"></div>
          <button type="submit" id="setup-btn" class="btn-login">
            <span class="btn-text">Create Admin Account</span>
            <span class="btn-loader"></span>
          </button>
        </form>

        <div class="login-divider">
          <span>or</span>
        </div>

        <button id="demo-btn" class="btn-demo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Try Demo
        </button>

        <p class="login-footer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          End-to-end encrypted • Your data never leaves your device
        </p>
      </div>
    </div>
  </div>

  <!-- App mounts here ONLY after auth succeeds -->
  <div id="app-root" style="display:none"></div>
  <div id="toast-container"></div>
  <div id="modal-overlay"></div>

  <!-- Only auth-critical scripts load before login -->
  <script type="module" src="js/crypto.js"></script>
  <script type="module" src="js/auth.js"></script>

  <!-- Register Service Worker for PWA / Offline -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
